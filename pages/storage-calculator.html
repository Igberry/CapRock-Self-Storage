<!-- ================================================================
     CapRock Self Storage — Storage Calculator page
     Body content only, header Global Section goes above this.
     Path suggestion: /storage-calculator

     Pick what you're storing, get a recommended size. The six
     options are editorial: they describe what a person has, which
     no API knows. The size and the rate behind each one come from
     the facility record, because this page used to recommend a
     10 x 10, a 10 x 15 and a 10 x 20, none of which are rented
     here. A calculator that names a unit you cannot rent is worse
     than no calculator.
     ================================================================ -->
<div class="crss-calc">
  <div class="crss-calc-inner">

    <nav class="crss-breadcrumb" aria-label="Breadcrumb">
      <a href="/home">Home</a><span>/</span><span>Storage Tools</span><span>/</span><span aria-current="page">Storage Calculator</span>
    </nav>

    <h1 class="crss-calc-title">Storage Size Calculator</h1>
    <p class="crss-calc-subtitle">Select what best describes what you're storing, and we'll recommend a starting size.</p>

    <div class="crss-calc-options" id="crss-calc-options">
      <!-- data-need is the space the contents want, in square feet.
           The unit that gets recommended for it is looked up live. -->
      <button type="button" class="crss-calc-option" data-need="25" data-detail="A few boxes and small items">A few boxes<br><span>or small items</span></button>
      <button type="button" class="crss-calc-option" data-need="50" data-detail="A studio or dorm room">Studio<br><span>or dorm room</span></button>
      <button type="button" class="crss-calc-option" data-need="100" data-detail="A one bedroom apartment">1 bedroom<br><span>apartment</span></button>
      <button type="button" class="crss-calc-option" data-need="150" data-detail="A two to three bedroom home">2 to 3 bedroom<br><span>home</span></button>
      <button type="button" class="crss-calc-option" data-need="200" data-detail="A three to four bedroom home, or a vehicle plus household items">3 to 4 bedroom<br><span>home</span></button>
      <button type="button" class="crss-calc-option" data-need="300" data-detail="A large home&rsquo;s full contents, or business inventory">Large home<br><span>or business</span></button>
    </div>

    <div class="crss-calc-result" id="crss-calc-result">
      <p class="crss-calc-result-label">Recommended size</p>
      <p class="crss-calc-result-size" id="crss-calc-result-size"></p>
      <p class="crss-calc-result-rate" id="crss-calc-result-rate" hidden></p>
      <p class="crss-calc-result-detail" id="crss-calc-result-detail"></p>
      <p class="crss-calc-result-note" id="crss-calc-result-note" hidden></p>
      <div class="crss-calc-result-actions">
        <a href="/lubbock-2213-n-quaker" class="crss-calc-btn-primary">See Units and Prices</a>
        <a href="/size-guide" class="crss-calc-btn-secondary">Compare All Sizes</a>
      </div>
    </div>
  </div>
</div>

<style>
  .crss-calc {
    font-family: 'Work Sans', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--crss-charcoal, #292724);
    background: var(--crss-bone, #FAF7F1);
  }
  .crss-calc, .crss-calc *, .crss-calc *::before, .crss-calc *::after {
    box-sizing: border-box;
  }
  .crss-calc :where(h1, p) {
    margin: 0;
    padding: 0;
  }
  .crss-calc :where(a) {
    text-decoration: none;
    color: inherit;
  }
  .crss-calc :focus-visible {
    outline: 2px solid var(--crss-terracotta, #A44A23);
    outline-offset: 3px;
    border-radius: 0;
  }

  .crss-calc-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 64px 32px 104px;
  }

  /* ============ BREADCRUMB ============ */
  .crss-breadcrumb {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 9px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--crss-taupe, #7F6C5D);
    margin-bottom: 30px;
  }
  .crss-breadcrumb a {
    transition: color .2s ease;
  }
  .crss-breadcrumb a:hover {
    color: var(--crss-terracotta, #A44A23);
  }
  .crss-breadcrumb [aria-current="page"] {
    color: var(--crss-charcoal, #292724);
  }

  /* ============ PAGE HEAD ============ */
  .crss-calc-title {
    font-family: 'Fraunces', Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: clamp(36px, 5.2vw, 52px);
    line-height: 1.06;
    letter-spacing: -0.02em;
    color: var(--crss-charcoal, #292724);
  }
  .crss-calc-title::after {
    content: '';
    display: block;
    width: 100%;
    height: 1px;
    background: var(--crss-rule-ink, #C4B49B);
    margin: 24px 0 22px;
  }
  .crss-calc-subtitle {
    font-size: 18px;
    line-height: 1.65;
    color: var(--crss-ink-soft, #5F564C);
    max-width: 58ch;
    margin-bottom: 44px;
  }

  /* ============ OPTION TILES ============ */
  .crss-calc-options {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(176px, 1fr));
    gap: 16px;
    margin-bottom: 40px;
  }
  .crss-calc-option {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.005em;
    text-align: center;
    color: var(--crss-charcoal, #292724);
    background: var(--crss-white, #FFFFFF);
    border: 1px solid var(--crss-rule, #E7DECD);
    border-radius: 0;
    padding: 26px 16px;
    cursor: pointer;
    line-height: 1.45;
    transition: transform .28s cubic-bezier(.4, 0, .2, 1), box-shadow .28s ease,
                border-color .28s ease, background .28s ease, color .28s ease;
  }
  .crss-calc-option span {
    display: block;
    font-weight: 400;
    color: var(--crss-ink-soft, #5F564C);
    font-size: 13.5px;
    margin-top: 2px;
    transition: color .28s ease;
  }
  .crss-calc-option:hover {
    transform: translateY(-3px);
    border-color: rgba(164, 74, 35, 0.35);
  }
  /* Selected reads as a solid, deliberate choice rather than a tinted box */
  .crss-calc-option.is-selected {
    background: var(--crss-charcoal, #292724);
    border-color: var(--crss-charcoal, #292724);
    color: var(--crss-cream, #F1E3CC);
  }
  .crss-calc-option.is-selected span {
    color: rgba(241, 227, 204, 0.72);
  }

  /* ============ RESULT ============ */
  .crss-calc-result {
    display: none;
    position: relative;
    overflow: hidden;
    background: var(--crss-white, #FFFFFF);
    border: 1px solid var(--crss-rule, #E7DECD);
    border-radius: 0;
    padding: 48px 40px 44px;
    text-align: center;
  }
  /* Terracotta cap marks this panel as the answer */
  .crss-calc-result::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--crss-terracotta, #A44A23);
  }
  .crss-calc-result.is-visible {
    display: block;
  }
  .crss-calc-result-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--crss-taupe, #7F6C5D);
    margin-bottom: 14px;
  }
  .crss-calc-result-size {
    font-family: 'Fraunces', Georgia, serif;
    font-optical-sizing: auto;
    font-size: clamp(40px, 6vw, 58px);
    font-weight: 500;
    line-height: 1.05;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--crss-terracotta, #A44A23);
    margin-bottom: 14px;
  }
  /* The sq ft figure the script appends beside the size */
  .crss-calc-result-sqft {
    font-family: 'Work Sans', Arial, sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--crss-taupe, #7F6C5D);
    vertical-align: middle;
    margin-left: 6px;
  }
  .crss-calc-result-rate {
    font-size: 17px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--crss-charcoal, #292724);
    margin-bottom: 14px;
  }
  /* Caveats: a cheaper larger unit, or two smaller ones. Quieter
     than the recommendation, but never hidden behind a click. */
  .crss-calc-result-note {
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--crss-taupe, #7F6C5D);
    max-width: 46ch;
    margin: -18px auto 30px;
  }
  .crss-calc-result-detail {
    font-size: 16px;
    line-height: 1.65;
    color: var(--crss-ink-soft, #5F564C);
    max-width: 46ch;
    margin: 0 auto 32px;
  }
  .crss-calc-result-actions {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .crss-calc-btn-primary, .crss-calc-btn-secondary {
    display: inline-block;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    padding: 16px 32px;
    border-radius: 0;
    transition: background .26s ease, color .26s ease, transform .26s cubic-bezier(.4, 0, .2, 1), box-shadow .26s ease, border-color .26s ease;
  }
  .crss-calc-btn-primary {
    background: var(--crss-terracotta, #A44A23);
    color: var(--crss-white, #FFFFFF);
  }
  .crss-calc-btn-primary:hover {
    background: var(--crss-terracotta-dark, #863B1A);
    transform: translateY(-2px);
  }
  .crss-calc-btn-secondary {
    background: transparent;
    color: var(--crss-charcoal, #292724);
    border: 1px solid var(--crss-border, #D9CDB9);
  }
  .crss-calc-btn-secondary:hover {
    border-color: var(--crss-charcoal, #292724);
    background: var(--crss-bone, #FAF7F1);
    transform: translateY(-2px);
  }

  /* ---- Full-bleed inside GHL ----
     GHL wraps a Custom Code element in its own centred, max-width row,
     so a full-width band stops short and leaves gutters either side.
     Margin cannot escape a parent's max-width; negative margins can.

     Deliberately pure CSS. An earlier version sized this from a
     JS-published viewport width, but that value goes stale whenever the
     viewport changes without firing a resize listener (device-preview
     iframes, orientation changes), leaving every wrapper sized for the
     wrong viewport - which on a phone looks exactly like a page that is
     not responsive. 50vw is always current.

     50vw includes the scrollbar, so the breakout overshoots by its
     width. overflow-x: clip on the root absorbs that. clip, not hidden:
     hidden creates a scroll container and breaks the sticky header. */
  html {
    overflow-x: clip;
  }
  .crss-calc {
    margin-left: calc(50% - 50vw);
    margin-right: calc(50% - 50vw);
  }

  @media (max-width: 768px) {
    .crss-calc-inner {
      padding: 48px 26px 80px;
    }
  }
  @media (max-width: 560px) {
    .crss-calc-inner {
      padding: 44px 20px 72px;
    }
    .crss-calc-result {
      padding: 38px 24px 34px;
    }
    .crss-calc-result-actions {
      flex-direction: column;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .crss-calc *, .crss-calc *::before, .crss-calc *::after {
      transition: none !important;
    }
    .crss-calc-option:hover, .crss-calc-btn-primary:hover, .crss-calc-btn-secondary:hover {
      transform: none;
    }
  }
</style>

<script>
  (function () {
    var options = document.getElementById('crss-calc-options');
    var result = document.getElementById('crss-calc-result');
    var resultSize = document.getElementById('crss-calc-result-size');
    var resultRate = document.getElementById('crss-calc-result-rate');
    var resultDetail = document.getElementById('crss-calc-result-detail');
    var resultNote = document.getElementById('crss-calc-result-note');
    if (!options || !result) return;

    /* Sorted smallest first, filled in when the facility record
       arrives. Null until then, and null forever if the proxy is
       unreachable, which the fallback below is written for. */
    var UNITS = null;
    var pendingNeed = null;

    function money(v) {
      return window.CRSS_WSS ? window.CRSS_WSS.money(v) : null;
    }

    function label(u) {
      return Number(u.width) + ' &times; ' + Number(u.length);
    }

    /* The smallest unit that holds the contents. Classic size-guide
       behaviour, and the one people expect. Where it goes wrong is
       priced into the notes below rather than silently optimised:
       a customer who asked for a 1 bedroom and was handed a 10 x 30
       deserves to be told why, not just charged for it. */
    function smallestThatFits(need) {
      for (var i = 0; i < UNITS.length; i++) {
        if (Number(UNITS[i].sqft) >= need) return UNITS[i];
      }
      return null;
    }

    /* A bigger unit that costs less. Not a trick: drive-up units
       without temperature control undercut smaller interior ones
       here, so the 8 x 10 really is larger and cheaper than the
       5 x 10. Saying so is the whole point of showing live rates. */
    function cheaperAndBigger(pick) {
      var best = null;
      UNITS.forEach(function (u) {
        if (Number(u.sqft) <= Number(pick.sqft)) return;
        if (!(Number(u.rate) < Number(pick.rate))) return;
        if (!best || Number(u.rate) < Number(best.rate)) best = u;
      });
      return best;
    }

    /* Two of something smaller, when the only unit that fits is a
       long way past what was asked for. This facility jumps from
       80 sq ft to 300, so a one bedroom would otherwise be quoted a
       10 x 30. Two 8 x 10s are more space for less money. */
    function twoSmaller(need, pick) {
      var best = null;
      UNITS.forEach(function (u) {
        if (Number(u.sqft) >= Number(pick.sqft)) return;
        if (Number(u.sqft) * 2 < need) return;
        if (!(Number(u.rate) * 2 < Number(pick.rate))) return;
        if (!best || Number(u.rate) < Number(best.rate)) best = u;
      });
      return best;
    }

    function show(need, detail) {
      var notes = [];

      /* No data: give the honest answer, which is the amount of
         space rather than a unit number we cannot vouch for. */
      if (!UNITS || !UNITS.length) {
        resultSize.innerHTML = 'About ' + need +
          ' <span class="crss-calc-result-sqft">sq ft</span>';
        resultRate.hidden = true;
        notes.push('Current sizes could not be loaded just now. Call ' +
                   '(806) 701-5660 and we will match this to what is open.');
      } else {
        var pick = smallestThatFits(need);
        if (!pick) {
          /* Bigger than anything here. Say so plainly. */
          pick = UNITS[UNITS.length - 1];
          notes.push('That is the largest unit at this location. ' +
                     'Two units are often the answer for a move this size, ' +
                     'so call the office and we will work it out with you.');
        } else {
          var cheaper = cheaperAndBigger(pick);
          if (cheaper) {
            notes.push('A ' + label(cheaper) + ' is bigger and costs less at ' +
                       money(cheaper.rate) + '/mo, if you do not need temperature control.');
          }
          var pair = twoSmaller(need, pick);
          if (pair) {
            notes.push('Two ' + label(pair) + ' units come to ' +
                       (Number(pair.sqft) * 2) + ' sq ft for ' + money(Number(pair.rate) * 2) +
                       '/mo, which is more space for less than the ' + label(pick) + '.');
          }
        }

        resultSize.innerHTML = label(pick) +
          ' <span class="crss-calc-result-sqft">' + Number(pick.sqft) + ' sq ft</span>';
        var rate = money(pick.rate);
        if (rate) {
          resultRate.textContent = rate + '/mo';
          resultRate.hidden = false;
        } else {
          resultRate.hidden = true;
        }
      }

      resultDetail.textContent = detail + '.';
      if (notes.length) {
        resultNote.textContent = notes.join(' ');
        resultNote.hidden = false;
      } else {
        resultNote.hidden = true;
      }
      result.classList.add('is-visible');
    }

    options.querySelectorAll('.crss-calc-option').forEach(function (btn) {
      btn.addEventListener('click', function () {
        options.querySelectorAll('.crss-calc-option').forEach(function (b) {
          b.classList.remove('is-selected');
        });
        btn.classList.add('is-selected');
        pendingNeed = btn;
        show(Number(btn.getAttribute('data-need')), btn.getAttribute('data-detail'));
        result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    });

    if (window.CRSS_WSS) {
      window.CRSS_WSS.get('movein').then(function (data) {
        if (!data || !data.unitTypes) return;
        UNITS = data.unitTypes.filter(function (u) {
          return u.available && isFinite(Number(u.sqft)) &&
                 isFinite(Number(u.width)) && isFinite(Number(u.length));
        }).sort(function (a, b) { return Number(a.sqft) - Number(b.sqft); });
        /* Someone may have clicked while this was in flight. Redraw
           their answer rather than leaving them on the fallback. */
        if (pendingNeed) {
          show(Number(pendingNeed.getAttribute('data-need')),
               pendingNeed.getAttribute('data-detail'));
        }
      });
    }
  })();
</script>
