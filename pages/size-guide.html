<!-- ================================================================
     CapRock Self Storage — Size Guide page
     Body content only. Assumes the header Global Section (with the
     Fraunces/Work Sans font import and the shared :root brand
     variables) is already placed above this on the page.

     HOW TO USE IN GHL
     Create a new page named "Size Guide", path /size-guide.
     Add the header Global Section, then a Custom Code element below
     it, and paste this whole block in.

     Unit sizes and dimensions here (2x5 through 10x30) are the same
     standard self storage sizes used industry-wide, not specific to
     any one competitor. The "best for" descriptions are generic
     starting copy, swap in CapRock's own wording whenever ready.
     ================================================================ -->
<div class="crss-sizeguide">
  <div class="crss-sizeguide-inner">

    <nav class="crss-breadcrumb" aria-label="Breadcrumb">
      <a href="/caprock-self-service">Home</a><span>/</span><span aria-current="page">Size Guide</span>
    </nav>

    <h1 class="crss-sg-title">Find the Right Storage Unit Size</h1>
    <p class="crss-sg-subtitle">The sizes available at CapRock, with current monthly rates. Availability changes, so check the location page before you travel.</p>

    <!-- Rendered from live WebSelfStorage data, not hardcoded.
         This page used to list nine generic industry sizes; the
         facility rents four, including an 8x10 that was missing
         from the nine, while six that were listed are not rented.
         A visitor could pick a size here and arrive to find it
         does not exist. -->
    <div class="crss-sg-grid" data-crss-sizes></div>
    <p class="crss-sg-state" data-crss-sizes-state>Loading current unit sizes&hellip;</p>

    <div class="crss-sg-cta">
      <p>Still not sure which size fits?</p>
      <a href="/find-storage" class="crss-sg-cta-btn">Find Your Nearest Location</a>
    </div>
  </div>
</div>

<style>
  .crss-sizeguide {
    font-family: 'Work Sans', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--crss-charcoal, #292724);
    background: var(--crss-bone, #FAF7F1);
  }
  .crss-sizeguide, .crss-sizeguide *, .crss-sizeguide *::before, .crss-sizeguide *::after {
    box-sizing: border-box;
  }
  .crss-sizeguide :where(h1, p) {
    margin: 0;
    padding: 0;
  }
  .crss-sizeguide :where(a) {
    text-decoration: none;
    color: inherit;
  }
  .crss-sizeguide :focus-visible {
    outline: 2px solid var(--crss-terracotta, #A44A23);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .crss-sizeguide-inner {
    max-width: 1140px;
    margin: 0 auto;
    padding: 64px 32px 104px;
  }

  /* ============ BREADCRUMB ============ */
  .crss-breadcrumb {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 9px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--crss-taupe, #7F6C5D);
    margin-bottom: 30px;
  }
  .crss-breadcrumb a {
    transition: color .2s ease;
  }
  .crss-breadcrumb a:hover {
    color: var(--crss-terracotta, #A44A23);
  }
  .crss-breadcrumb [aria-current="page"] {
    color: var(--crss-charcoal, #292724);
  }

  /* ============ PAGE HEAD ============ */
  .crss-sg-title {
    font-family: 'Fraunces', Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: clamp(36px, 5.2vw, 54px);
    line-height: 1.06;
    letter-spacing: -0.02em;
    max-width: 20ch;
    color: var(--crss-charcoal, #292724);
  }
  .crss-sg-title::after {
    content: '';
    display: block;
    width: 54px;
    height: 2px;
    background: var(--crss-terracotta, #A44A23);
    margin: 24px 0 22px;
  }
  .crss-sg-subtitle {
    font-size: 18px;
    color: var(--crss-ink-soft, #5F564C);
    max-width: 62ch;
    line-height: 1.65;
    margin-bottom: 48px;
  }

  /* ============ SIZE CARDS ============ */
  .crss-sg-grid {
    display: grid;
    /* 260px, not 248px: the 10x30 diagram is a fixed 180px box and a
       248px column leaves only ~176px of drawing area, clipping it. */
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 22px;
  }
  .crss-size-card {
    background: var(--crss-white, #FFFFFF);
    border: 1px solid var(--crss-rule, rgba(41, 39, 36, 0.09));
    border-radius: 6px;
    padding: 24px 24px 26px;
    box-shadow: 0 1px 2px rgba(41, 39, 36, 0.04);
    transition: transform .3s cubic-bezier(.4, 0, .2, 1), box-shadow .3s ease, border-color .3s ease;
  }
  .crss-size-card:hover {
    transform: translateY(-3px);
    border-color: rgba(164, 74, 35, 0.28);
    box-shadow: 0 2px 4px rgba(41, 39, 36, 0.04), 0 18px 36px -14px rgba(41, 39, 36, 0.26);
  }

  /* Scale drawing: a fine measured grid the unit block sits on.
     The block's width/height come from inline styles in the markup,
     one per size, so the nine cards stay proportional to each other. */
  .crss-size-diagram {
    position: relative;
    height: 92px;
    display: flex;
    align-items: flex-end;
    background-color: var(--crss-bone, #FAF7F1);
    background-image: linear-gradient(rgba(41, 39, 36, 0.07) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(41, 39, 36, 0.07) 1px, transparent 1px);
    background-size: 10px 10px;
    background-position: bottom left;
    border: 1px solid var(--crss-rule, rgba(41, 39, 36, 0.09));
    border-radius: 4px;
    margin-bottom: 20px;
    padding: 0 12px 12px;
    overflow: hidden;
  }
  .crss-size-box {
    background-color: var(--crss-terracotta, #A44A23);
    background-image: linear-gradient(160deg, rgba(255, 255, 255, 0.18), rgba(0, 0, 0, 0.10));
    border: 1px solid rgba(134, 59, 26, 0.9);
    border-radius: 2px;
    box-shadow: 0 2px 6px -1px rgba(164, 74, 35, 0.45);
    transition: transform .3s cubic-bezier(.4, 0, .2, 1);
    transform-origin: bottom left;
  }
  .crss-size-card:hover .crss-size-box {
    transform: scale(1.04);
  }

  .crss-size-dim {
    font-family: 'Fraunces', Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: 25px;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    color: var(--crss-charcoal, #292724);
  }
  .crss-size-sqft {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--crss-taupe, #7F6C5D);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-top: 6px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--crss-rule, rgba(41, 39, 36, 0.09));
    margin-bottom: 14px;
  }
  .crss-size-fits {
    font-size: 15px;
    line-height: 1.62;
    color: var(--crss-ink-soft, #5F564C);
  }

  /* ============ CLOSING CTA ============ */
  /* Loading and failure share one restrained treatment: a page that
     cannot reach the API should not look broken. */
  .crss-sg-state {
    font-size: 15.5px;
    line-height: 1.68;
    color: var(--crss-ink-soft, #5F564C);
    background: var(--crss-sand, #EFE7DA);
    border-radius: 6px;
    padding: 26px 28px;
  }
  .crss-sg-state a {
    color: var(--crss-terracotta, #A44A23);
    font-weight: 600;
  }
  .crss-size-rate {
    font-family: 'Fraunces', Georgia, serif;
    font-optical-sizing: auto;
    font-size: 21px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--crss-terracotta, #A44A23);
    margin-top: 14px;
  }
  .crss-size-rate span {
    font-family: 'Work Sans', Arial, sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--crss-taupe, #7F6C5D);
  }
  .crss-size-flags {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--crss-taupe, #7F6C5D);
    margin-top: 8px;
  }

  .crss-sg-cta {
    position: relative;
    overflow: hidden;
    margin-top: 72px;
    padding: 54px 40px;
    background: var(--crss-charcoal, #292724);
    border-radius: 6px;
    text-align: center;
  }
  .crss-sg-cta::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    background: radial-gradient(120% 100% at 50% 0%, rgba(164, 74, 35, 0.30), transparent 62%);
    pointer-events: none;
  }
  .crss-sg-cta p {
    position: relative;
    font-family: 'Fraunces', Georgia, serif;
    font-optical-sizing: auto;
    font-size: clamp(21px, 2.6vw, 27px);
    font-weight: 500;
    line-height: 1.32;
    letter-spacing: -0.01em;
    color: var(--crss-cream, #F1E3CC);
    margin-bottom: 26px;
  }
  .crss-sg-cta-btn {
    position: relative;
    display: inline-block;
    background: var(--crss-terracotta, #A44A23);
    color: var(--crss-white, #FFFFFF);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    padding: 16px 34px;
    border-radius: 4px;
    box-shadow: 0 0 0 1px rgba(241, 227, 204, 0.18), 0 1px 2px rgba(0, 0, 0, 0.25);
    transition: background .26s ease, transform .26s cubic-bezier(.4, 0, .2, 1), box-shadow .26s ease;
  }
  .crss-sg-cta-btn:hover {
    background: var(--crss-terracotta-dark, #863B1A);
    transform: translateY(-2px);
    box-shadow: 0 0 0 1px rgba(241, 227, 204, 0.24), 0 12px 24px -8px rgba(164, 74, 35, 0.75);
  }

  /* ---- Full-bleed inside GHL ----
     GHL wraps a Custom Code element in its own centred, max-width row,
     so a full-width band stops short and leaves gutters either side.
     Margin cannot escape a parent's max-width; negative margins can.

     Deliberately pure CSS. An earlier version sized this from a
     JS-published viewport width, but that value goes stale whenever the
     viewport changes without firing a resize listener (device-preview
     iframes, orientation changes), leaving every wrapper sized for the
     wrong viewport - which on a phone looks exactly like a page that is
     not responsive. 50vw is always current.

     50vw includes the scrollbar, so the breakout overshoots by its
     width. overflow-x: clip on the root absorbs that. clip, not hidden:
     hidden creates a scroll container and breaks the sticky header. */
  html {
    overflow-x: clip;
  }
  .crss-sizeguide {
    margin-left: calc(50% - 50vw);
    margin-right: calc(50% - 50vw);
  }

  @media (max-width: 768px) {
    .crss-sizeguide-inner {
      padding: 48px 26px 80px;
    }
  }
  @media (max-width: 560px) {
    .crss-sizeguide-inner {
      padding: 44px 20px 72px;
    }
    .crss-sg-cta {
      padding: 42px 24px;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .crss-sizeguide *, .crss-sizeguide *::before, .crss-sizeguide *::after {
      transition: none !important;
    }
    .crss-size-card:hover, .crss-sg-cta-btn:hover {
      transform: none;
    }
    .crss-size-card:hover .crss-size-box {
      transform: none;
    }
  }
</style>

<script>
  (function () {
    var grid = document.querySelector('[data-crss-sizes]');
    var state = document.querySelector('[data-crss-sizes-state]');
    if (!grid || !state) return;

    var FALLBACK = 'Current sizes could not be loaded just now. ' +
      '<a href="/lubbock-2213-n-quaker">See the location page</a> or call the office.';

    /* Copy per size. Keyed on WxL so it survives the list changing;
       anything unrecognised falls back to a description derived from
       the square footage rather than being left blank. */
    var COPY = {
      '5x5':   "About a walk-in closet's worth: boxes, a dresser, a few chairs.",
      '5x10':  "A studio or one bedroom apartment's furniture and boxes.",
      '8x10':  "A one bedroom apartment including larger furniture, or the contents of a small garage.",
      '10x10': "A one to two bedroom apartment, including larger furniture and appliances.",
      '10x15': "A two to three bedroom home's furniture and boxes.",
      '10x20': "A three to four bedroom home, or a vehicle plus household items.",
      '10x30': "A full house or business inventory. The largest size here."
    };

    function describe(u) {
      var key = u.width + 'x' + u.length;
      if (COPY[key]) return COPY[key];
      var sq = Number(u.sqft) || 0;
      if (sq <= 30) return 'Seasonal items, boxes and a few small pieces.';
      if (sq <= 60) return 'A studio or one bedroom\u2019s furniture and boxes.';
      if (sq <= 120) return 'A one to two bedroom home, including larger furniture.';
      if (sq <= 220) return 'A two to three bedroom home\u2019s contents.';
      return 'A full house or business inventory.';
    }

    /* 6px per foot, matching the scale the static cards used, so the
       drawings stay proportional to one another. The widest here
       (10x30) lands at 180px, which fits the 260px column. */
    var PX_PER_FT = 6;

    if (!window.CRSS_WSS) {
      state.innerHTML = FALLBACK;
      return;
    }

    window.CRSS_WSS.get('movein').then(function (data) {
      var list = (data && data.unitTypes) || [];
      if (!list.length) {
        state.innerHTML = FALLBACK;
        return;
      }
      list.sort(function (a, b) { return (Number(a.sqft) || 0) - (Number(b.sqft) || 0); });

      grid.innerHTML = list.map(function (u) {
        var w = Math.round((Number(u.length) || 0) * PX_PER_FT);
        var h = Math.round((Number(u.width) || 0) * PX_PER_FT);
        var rate = window.CRSS_WSS.money(u.rate);
        var flags = [u.driveUp && 'Drive-up', u.climate && 'Climate controlled', u.ada && 'ADA']
                      .filter(Boolean).join(' &middot; ');
        return '<div class="crss-size-card">' +
          '<div class="crss-size-diagram"><div class="crss-size-box" style="width:' + w +
            'px;height:' + h + 'px;"></div></div>' +
          '<div class="crss-size-dim">' + u.width + ' &times; ' + u.length + '</div>' +
          '<div class="crss-size-sqft">' + (u.sqft || '') + ' sq ft</div>' +
          '<p class="crss-size-fits">' + describe(u) + '</p>' +
          (flags ? '<p class="crss-size-flags">' + flags + '</p>' : '') +
          (rate ? '<p class="crss-size-rate">' + rate + ' <span>/mo</span></p>' : '') +
        '</div>';
      }).join('');

      state.hidden = true;
    });
  })();
</script>
