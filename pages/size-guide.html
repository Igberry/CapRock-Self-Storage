<!-- ================================================================
     CapRock Self Storage — Size Guide page
     Body content only. Assumes the header Global Section (with the
     Fraunces/Work Sans font import and the shared :root brand
     variables) is already placed above this on the page.

     HOW TO USE IN GHL
     Create a new page named "Size Guide", path /size-guide.
     Add the header Global Section, then a Custom Code element below
     it, and paste this whole block in.

     Unit sizes and dimensions here (2x5 through 10x30) are the same
     standard self storage sizes used industry-wide, not specific to
     any one competitor. The "best for" descriptions are generic
     starting copy, swap in CapRock's own wording whenever ready.
     ================================================================ -->
<div class="crss-sizeguide">
  <div class="crss-sizeguide-inner">

    <nav class="crss-breadcrumb" aria-label="Breadcrumb">
      <a href="/home">Home</a><span>/</span><span aria-current="page">Size Guide</span>
    </nav>

    <h1 class="crss-sg-title">Find the Right Storage Unit Size</h1>
    <p class="crss-sg-subtitle">The sizes available at CapRock, with current monthly rates. Availability changes, so check the location page before you travel.</p>

    <!-- Rendered from live WebSelfStorage data, not hardcoded.
         This page used to list nine generic industry sizes; the
         facility rents four, including an 8x10 that was missing
         from the nine, while six that were listed are not rented.
         A visitor could pick a size here and arrive to find it
         does not exist. -->
    <div class="crss-sg-grid" data-crss-sizes></div>
    <p class="crss-sg-state" data-crss-sizes-state>Loading current unit sizes&hellip;</p>

    <div class="crss-sg-cta">
      <p>Still not sure which size fits?</p>
      <a href="/lubbock-2213-n-quaker" class="crss-sg-cta-btn">See Units and Prices</a>
    </div>

    <!-- Details dialog. One element reused for every size, filled
         on open: fifteen hidden copies of the same panel would be
         fifteen times the markup for a thing at most one of which
         is ever on screen.

         <dialog> rather than a div: the browser handles the
         backdrop, Escape, and returning focus to the card that
         opened it, all of which are easy to get wrong by hand. -->
    <dialog class="crss-sg-modal" data-crss-modal aria-labelledby="crss-sg-modal-title">
      <button type="button" class="crss-sg-modal-close" data-crss-modal-close aria-label="Close">&times;</button>
      <div data-crss-modal-body></div>
    </dialog>
  </div>
</div>

  /* ---- Full-bleed inside GHL ----
     GHL wraps a Custom Code element in its own centred, max-width row,
     so a full-width band stops short and leaves gutters either side.
     Margin cannot escape a parent's max-width; negative margins can.

     Deliberately pure CSS. An earlier version sized this from a
     JS-published viewport width, but that value goes stale whenever the
     viewport changes without firing a resize listener (device-preview
     iframes, orientation changes), leaving every wrapper sized for the
     wrong viewport - which on a phone looks exactly like a page that is
     not responsive. 50vw is always current.

     50vw includes the scrollbar, so the breakout overshoots by its
     width. overflow-x: clip on the root absorbs that. clip, not hidden:
     hidden creates a scroll container and breaks the sticky header. */
  html {
    overflow-x: clip;
  }
  .crss-sizeguide {
    margin-left: calc(50% - 50vw);
    margin-right: calc(50% - 50vw);
  }

<script>
  (function () {
    var grid = document.querySelector('[data-crss-sizes]');
    var state = document.querySelector('[data-crss-sizes-state]');
    if (!grid || !state) return;

    var FALLBACK = 'Current sizes could not be loaded just now. ' +
      '<a href="/lubbock-2213-n-quaker">See the location page</a> or call the office.';

    /* Copy per size. Keyed on WxL so it survives the list changing;
       anything unrecognised falls back to a description derived from
       the square footage rather than being left blank. */
    var COPY = {
      '5x5':   "About a walk-in closet's worth: boxes, a dresser, a few chairs.",
      '5x10':  "A studio or one bedroom apartment's furniture and boxes.",
      '8x10':  "A one bedroom apartment including larger furniture, or the contents of a small garage.",
      '10x10': "A one to two bedroom apartment, including larger furniture and appliances.",
      '10x15': "A two to three bedroom home's furniture and boxes.",
      '10x20': "A three to four bedroom home, or a vehicle plus household items.",
      '10x30': "A full house or business inventory. The largest size here."
    };

    function describe(u) {
      var key = u.width + 'x' + u.length;
      if (COPY[key]) return COPY[key];
      var sq = Number(u.sqft) || 0;
      if (sq <= 30) return 'Seasonal items, boxes and a few small pieces.';
      if (sq <= 60) return 'A studio or one bedroom\u2019s furniture and boxes.';
      if (sq <= 120) return 'A one to two bedroom home, including larger furniture.';
      if (sq <= 220) return 'A two to three bedroom home\u2019s contents.';
      return 'A full house or business inventory.';
    }

    /* 6px per foot, matching the scale the static cards used, so the
       drawings stay proportional to one another. The widest here
       (10x30) lands at 180px, which fits the 260px column. */
    var PX_PER_FT = 6;

    /* ================= UNIT DETAILS DIALOG =================
       What a unit holds, by size band rather than a lookup per size:
       a size added to the rate sheet later still opens a useful panel
       instead of an empty one.

       The lists are ordinary storage knowledge, written here. They are
       deliberately not lifted from the facility system's own unit
       pages, which are U-Haul's copy. */
    var BANDS = [
      { upTo: 30,  uses: ['Decluttering a room', 'Seasonal decorations', 'Storing between semesters'],
        items: ['Boxes of household items', 'Seasonal clothing', 'Small furniture', 'Books and documents',
                'Sports equipment', 'Holiday decorations'],
        prose: 'About the footprint of a walk-in closet. It takes what will not fit in one ' +
               'any more: a stack of boxes, a few small pieces of furniture, and the things ' +
               'that only come out once a year.' },
      { upTo: 60,  uses: ['A studio or dorm move', 'A room of furniture', 'Storing between homes'],
        items: ['A mattress set', 'A chest of drawers', 'A small sofa', 'Boxes of clothes and kitchenware',
                'A bicycle', 'Office or file boxes'],
        prose: 'Roughly the size of a large walk-in wardrobe, and the size most students and ' +
               'single renters take. It holds the contents of one furnished room with space ' +
               'left to walk in and reach the back.' },
      { upTo: 120, uses: ['A one or two bedroom move', 'Clearing a garage', 'Business stock'],
        items: ['A bedroom set', 'A sofa and armchairs', 'A dining table and chairs',
                'A washer or dryer', 'Twenty to thirty boxes', 'Garden tools and equipment'],
        prose: 'The size of a small bedroom. A one bedroom home fits comfortably, including ' +
               'the larger furniture and appliances that defeat smaller units, and it is the ' +
               'usual choice for emptying a garage.' },
      { upTo: 260, uses: ['A two or three bedroom move', 'A long renovation', 'Trade equipment'],
        items: ['Several bedroom sets', 'A full living room', 'A refrigerator and appliances',
                'Fifty or more boxes', 'A workbench and tools', 'Patio furniture'],
        prose: 'A single-car garage, near enough. It takes a family home’s worth of furniture ' +
               'with room to stack, which makes it the size to pick for a renovation that ' +
               'might run longer than planned.' },
      { upTo: 450, uses: ['A three or four bedroom move', 'Vehicle storage', 'Business inventory'],
        items: ['A whole household of furniture', 'Major appliances', 'A car, boat or trailer',
                'Bulk business stock', 'Workshop machinery', 'Landscaping equipment'],
        prose: 'Long enough for a vehicle with room to spare, or for the contents of a larger ' +
               'family home. At this size the drive-up access matters as much as the space: ' +
               'you can back a van to the door.' },
      { upTo: Infinity, uses: ['A full house move', 'Commercial storage', 'Fleet or plant'],
        items: ['The contents of a large home', 'Multiple vehicles', 'Pallets of inventory',
                'Construction plant', 'Trade fair and event kit', 'Archive and records'],
        prose: 'The largest CapRock rents, and closer to a small commercial unit than a ' +
               'storage locker. It suits a whole house, a business that needs stock at ' +
               'arm’s length, or more than one vehicle.' }
    ];

    function bandFor(u) {
      var sq = Number(u.sqft) || 0;
      for (var i = 0; i < BANDS.length; i++) {
        if (sq <= BANDS[i].upTo) return BANDS[i];
      }
      return BANDS[BANDS.length - 1];
    }

    function list(items) {
      return '<ul>' + items.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>';
    }

    function wireModal(units) {
      var modal = document.querySelector('[data-crss-modal]');
      var body = document.querySelector('[data-crss-modal-body]');
      var closeBtn = document.querySelector('[data-crss-modal-close]');
      /* <dialog> is well supported now, but if it is not there at all
         the cards simply do nothing rather than throwing on click. */
      if (!modal || !body || typeof modal.showModal !== 'function') return;

      document.querySelectorAll('[data-crss-size]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var u = units[Number(btn.getAttribute('data-crss-size'))];
          if (!u) return;
          var band = bandFor(u);
          var rate = window.CRSS_WSS.money(u.rate);
          var cubic = (Number(u.sqft) || 0) * (Number(u.height) || 0);

          body.innerHTML =
            '<div class="crss-sg-modal-inner">' +
              '<h2 class="crss-sg-modal-title" id="crss-sg-modal-title">' +
                u.width + ' &times; ' + u.length + ' Unit Information</h2>' +

              '<div class="crss-sg-modal-top">' +
                '<div class="crss-sg-modal-art">' + window.CRSS_WSS.art(u) + '</div>' +
                '<div class="crss-sg-facts">' +
                  '<div>' +
                    '<p class="crss-sg-fact-label">Measurements</p>' +
                    '<p class="crss-sg-fact-value">' + u.sqft + ' sq ft</p>' +
                    (cubic ? '<p class="crss-sg-fact-note">' + cubic + ' cu ft</p>' : '') +
                  '</div>' +
                  '<div>' +
                    '<p class="crss-sg-fact-label">Height</p>' +
                    '<p class="crss-sg-fact-value">' + (u.height ? u.height + ' ft' : 'Not stated') + '</p>' +
                    '<p class="crss-sg-fact-note">Door height is lower than the ceiling.</p>' +
                  '</div>' +
                  '<div>' +
                    '<p class="crss-sg-fact-label">Type</p>' +
                    '<p class="crss-sg-fact-value">' + window.CRSS_WSS.band(u) + '</p>' +
                  '</div>' +
                  '<div>' +
                    '<p class="crss-sg-fact-label">Features</p>' +
                    '<p class="crss-sg-fact-note" style="margin-top:0">' +
                      window.CRSS_WSS.attributes(u).join(', ') + '</p>' +
                  '</div>' +
                '</div>' +
              '</div>' +

              '<h3>Common uses</h3>' + list(band.uses) +
              '<h3>What people usually store</h3>' +
              '<div class="crss-sg-modal-cols">' +
                list(band.items.slice(0, Math.ceil(band.items.length / 2))) +
                list(band.items.slice(Math.ceil(band.items.length / 2))) +
              '</div>' +
              '<h3>How big is a ' + u.width + ' &times; ' + u.length + '?</h3>' +
              '<p class="crss-sg-modal-prose">' + band.prose + '</p>' +

              '<div class="crss-sg-modal-foot">' +
                (rate ? '<p class="crss-sg-modal-rate">' + rate + '<span>per month</span></p>' : '') +
                '<a class="crss-sg-modal-btn" href="/lubbock-2213-n-quaker#units">Check availability</a>' +
              '</div>' +
            '</div>';

          modal.showModal();
        });
      });

      if (closeBtn) closeBtn.addEventListener('click', function () { modal.close(); });
      /* Clicking the backdrop closes it. The dialog fills its own box,
         so a click landing on the dialog element itself was outside
         the content. */
      modal.addEventListener('click', function (e) {
        if (e.target === modal) modal.close();
      });
    }

    if (!window.CRSS_WSS) {
      state.innerHTML = FALLBACK;
      return;
    }

    window.CRSS_WSS.get('movein').then(function (data) {
      var list = (data && data.unitTypes) || [];
      if (!list.length) {
        state.innerHTML = FALLBACK;
        return;
      }
      list.sort(function (a, b) { return (Number(a.sqft) || 0) - (Number(b.sqft) || 0); });

      grid.innerHTML = list.map(function (u, i) {
        var w = Math.round((Number(u.length) || 0) * PX_PER_FT);
        var h = Math.round((Number(u.width) || 0) * PX_PER_FT);
        var rate = window.CRSS_WSS.money(u.rate);
        /* Taken from the same two sets the rows and the dialog use, so
           a card cannot claim something the panel behind it denies.
           It was reading u.driveUp, u.climate and u.ada straight off
           the feed, which is exactly the data CapRock corrected. */
        var flags = window.CRSS_WSS.attributes(u).slice(0, 3).join(' &middot; ');
        /* A button, not a div with a click handler: it reaches the
           keyboard and a screen reader announces it as something that
           can be pressed. */
        return '<button type="button" class="crss-sg-card-btn" data-crss-size="' + i + '">' +
          '<div class="crss-size-card">' +
            '<div class="crss-size-diagram"><div class="crss-size-box" style="width:' + w +
              'px;height:' + h + 'px;"></div></div>' +
            '<div class="crss-size-dim">' + u.width + ' &times; ' + u.length + '</div>' +
            '<div class="crss-size-sqft">' + (u.sqft || '') + ' sq ft</div>' +
            '<p class="crss-size-fits">' + describe(u) + '</p>' +
            (flags ? '<p class="crss-size-flags">' + flags + '</p>' : '') +
            (rate ? '<p class="crss-size-rate">' + rate + ' <span>/mo</span></p>' : '') +
            '<span class="crss-size-more">Unit details</span>' +
          '</div>' +
        '</button>';
      }).join('');

      state.hidden = true;
      wireModal(list);
    });
  })();
</script>
