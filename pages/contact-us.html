<!-- ================================================================
     CapRock Self Storage — Contact Us page
     Body content only, header Global Section goes above this.
     Path suggestion: /contact-us

     IMPORTANT: the form below is styled but not wired to send
     anywhere, custom code has no backend to submit to. In GHL, swap
     this for GHL's native Forms element instead (drag it in below
     the intro text and delete the <form> block here). GHL's native
     forms connect straight to the CRM automatically, a raw HTML
     form does not.

     PLACEHOLDER: general phone/email are dummy values, same as the
     header and Lubbock page.
     ================================================================ -->
<div class="crss-contact">
  <div class="crss-contact-inner">

    <nav class="crss-breadcrumb" aria-label="Breadcrumb">
      <a href="/">Home</a><span>/</span><span>About Us</span><span>/</span><span aria-current="page">Contact Us</span>
    </nav>

    <h1 class="crss-contact-title">Contact Us</h1>
    <p class="crss-contact-subtitle">Have a general question? Send us a message. For questions about a specific unit or move-in, find your nearest location instead.</p>

    <div class="crss-contact-grid">
      <div class="crss-contact-info">
        <div class="crss-contact-info-row">
          <span class="crss-contact-label">Phone</span>
          <a href="tel:18060000000">(806) 000-0000</a>
        </div>
        <div class="crss-contact-info-row">
          <span class="crss-contact-label">Email</span>
          <a href="mailto:info@caprockselfstorage.com">info@caprockselfstorage.com</a>
        </div>
        <a href="/find-storage" class="crss-contact-location-link">Looking for a specific location? →</a>
      </div>

      <!-- REPLACE with GHL's native Forms element before launch -->
      <form class="crss-contact-form" id="crss-contact-form">
        <label>Name<input type="text" name="name" required></label>
        <label>Email<input type="email" name="email" required></label>
        <label>Phone<input type="tel" name="phone"></label>
        <label>Message<textarea name="message" rows="4" required></textarea></label>
        <button type="submit" class="crss-contact-submit">Send Message</button>
        <p class="crss-contact-confirm" id="crss-contact-confirm">Thanks, we'll be in touch soon.</p>
      </form>
    </div>
  </div>
</div>

<style>
  .crss-contact {
    font-family: 'Work Sans', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--crss-charcoal, #292724);
    background: var(--crss-bone, #FAF7F1);
  }
  .crss-contact, .crss-contact *, .crss-contact *::before, .crss-contact *::after {
    box-sizing: border-box;
  }
  .crss-contact :where(h1, p) {
    margin: 0;
    padding: 0;
  }
  .crss-contact a {
    text-decoration: none;
    color: inherit;
  }
  .crss-contact :focus-visible {
    outline: 2px solid var(--crss-terracotta, #A44A23);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .crss-contact-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 64px 32px 104px;
  }

  /* ============ BREADCRUMB ============ */
  .crss-breadcrumb {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 9px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--crss-taupe, #7F6C5D);
    margin-bottom: 30px;
  }
  .crss-breadcrumb a {
    transition: color .2s ease;
  }
  .crss-breadcrumb a:hover {
    color: var(--crss-terracotta, #A44A23);
  }
  .crss-breadcrumb [aria-current="page"] {
    color: var(--crss-charcoal, #292724);
  }

  /* ============ PAGE HEAD ============ */
  .crss-contact-title {
    font-family: 'Fraunces', Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: clamp(36px, 5.2vw, 52px);
    line-height: 1.06;
    letter-spacing: -0.02em;
    color: var(--crss-charcoal, #292724);
  }
  .crss-contact-title::after {
    content: '';
    display: block;
    width: 54px;
    height: 2px;
    background: var(--crss-terracotta, #A44A23);
    margin: 24px 0 22px;
  }
  .crss-contact-subtitle {
    font-size: 18px;
    color: var(--crss-ink-soft, #5F564C);
    max-width: 60ch;
    line-height: 1.65;
    margin-bottom: 48px;
  }

  /* ============ LAYOUT ============ */
  .crss-contact-grid {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 28px;
    align-items: start;
  }

  /* ---- Direct contact details ---- */
  .crss-contact-info {
    background: var(--crss-white, #FFFFFF);
    border: 1px solid var(--crss-rule, rgba(41, 39, 36, 0.09));
    border-radius: 6px;
    padding: 28px 26px;
    box-shadow: 0 1px 2px rgba(41, 39, 36, 0.04);
  }
  .crss-contact-info-row {
    padding-bottom: 18px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--crss-rule, rgba(41, 39, 36, 0.09));
  }
  .crss-contact-label {
    display: block;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--crss-taupe, #7F6C5D);
    margin-bottom: 7px;
  }
  .crss-contact-info-row a {
    font-size: 16px;
    font-weight: 500;
    color: var(--crss-charcoal, #292724);
    word-break: break-word;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    text-decoration-color: rgba(164, 74, 35, 0.32);
    transition: color .22s ease, text-decoration-color .22s ease;
  }
  .crss-contact-info-row a:hover {
    color: var(--crss-terracotta, #A44A23);
    text-decoration-color: var(--crss-terracotta, #A44A23);
  }
  .crss-contact-location-link {
    display: inline-flex;
    align-items: center;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    line-height: 1.5;
    color: var(--crss-terracotta, #A44A23);
    transition: transform .26s cubic-bezier(.4, 0, .2, 1), color .22s ease;
  }
  .crss-contact-location-link:hover {
    color: var(--crss-terracotta-dark, #863B1A);
    transform: translateX(3px);
  }

  /* ---- Form (placeholder markup, swap for GHL's native Forms element) ---- */
  .crss-contact-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
    background: var(--crss-white, #FFFFFF);
    border: 1px solid var(--crss-rule, rgba(41, 39, 36, 0.09));
    border-radius: 6px;
    padding: 34px 36px;
    box-shadow: 0 1px 2px rgba(41, 39, 36, 0.04);
  }
  .crss-contact-form label {
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--crss-taupe, #7F6C5D);
  }
  .crss-contact-form input, .crss-contact-form textarea {
    font-family: inherit;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: normal;
    text-transform: none;
    line-height: 1.5;
    color: var(--crss-charcoal, #292724);
    background: var(--crss-bone, #FAF7F1);
    border: 1px solid var(--crss-border, rgba(41, 39, 36, 0.12));
    border-radius: 5px;
    padding: 13px 14px;
    resize: vertical;
    transition: border-color .24s ease, box-shadow .24s ease, background .24s ease;
  }
  .crss-contact-form input:focus, .crss-contact-form textarea:focus {
    background: var(--crss-white, #FFFFFF);
    border-color: var(--crss-terracotta, #A44A23);
    box-shadow: 0 0 0 3px rgba(164, 74, 35, 0.12);
    outline: none;
  }
  .crss-contact-submit {
    align-self: flex-start;
    margin-top: 4px;
    background: var(--crss-terracotta, #A44A23);
    color: var(--crss-white, #FFFFFF);
    font-family: inherit;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    padding: 16px 34px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(41, 39, 36, 0.12);
    transition: background .26s ease, transform .26s cubic-bezier(.4, 0, .2, 1), box-shadow .26s ease;
  }
  .crss-contact-submit:hover {
    background: var(--crss-terracotta-dark, #863B1A);
    transform: translateY(-2px);
    box-shadow: 0 12px 24px -8px rgba(164, 74, 35, 0.6);
  }
  .crss-contact-confirm {
    display: none;
    font-size: 15px;
    font-weight: 500;
    line-height: 1.6;
    color: var(--crss-charcoal, #292724);
    background: var(--crss-sand, #EFE7DA);
    border-left: 2px solid var(--crss-terracotta, #A44A23);
    border-radius: 0 4px 4px 0;
    padding: 16px 18px;
  }
  .crss-contact-confirm.is-visible {
    display: block;
  }

  @media (max-width: 720px) {
    .crss-contact-grid {
      grid-template-columns: 1fr;
    }
  }
  @media (max-width: 560px) {
    .crss-contact-inner {
      padding: 44px 20px 72px;
    }
    .crss-contact-form {
      padding: 26px 24px;
    }
    .crss-contact-submit {
      align-self: stretch;
      text-align: center;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .crss-contact *, .crss-contact *::before, .crss-contact *::after {
      transition: none !important;
    }
    .crss-contact-submit:hover, .crss-contact-location-link:hover {
      transform: none;
    }
  }
</style>

<script>
  /* Placeholder-only submit handler, just confirms visually.
     Delete this whole form and use GHL's native Forms element for
     real submissions. */
  (function () {
    var form = document.getElementById('crss-contact-form');
    var confirm = document.getElementById('crss-contact-confirm');
    if (!form || !confirm) return;
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      confirm.classList.add('is-visible');
      form.reset();
    });
  })();
</script>
